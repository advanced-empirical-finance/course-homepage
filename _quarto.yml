format:
  html:
    theme:
      - cosmo
    css: styles.css
    toc: true
    code-block-border-left: true
    grid:
      sidebar-width: 250px
      body-width: 1100px      # wider content (Quarto default is 900px)
      margin-width: 200px
      gutter-width: 1.5rem


eval:
  false