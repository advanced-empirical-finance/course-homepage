project:
  type: website
  output-dir: docs
  # Copies the latest lecture decks from ../course-repository into slides/
  # before every render; the lecture plan links them. Requires
  # course-repository checked out alongside this repo.
  pre-render:
    - tools/copy-decks.R
  resources:
    - slides/
    - trading-game/intro/**   # the intro animation's player, scripts and media
    - CNAME      # keep the custom domain on every render of docs/


website:
  navbar:
    collapse: true
    search: true
    right:
      - text: home
        file: index.qmd
      - text: lecture plan
        file: slides-index.qmd
      - text: exercises
        menu:
          - text: "overview"
            file: exercises/index.qmd
          - text: "---"
          - text: "start"
          - text: "technical prerequisites"
            file: exercises/technical-prerequisites.qmd
          - text: "introduction to tidy finance"
            file: exercises/introduction.qmd
          - text: "---"
          - text: "from portfolio choice to pricing"
          - text: "mean-variance optimization"
            file: exercises/mean_variance.qmd
          - text: "shrinkage and transaction costs"
            file: exercises/portfolio_choice.qmd
          - text: "beta estimation"
            file: exercises/beta_estimation.qmd
          - text: "portfolio sorts"
            file: exercises/portfolio_sorts.qmd
          - text: "---"
          - text: "machine learning and the SDF"
          - text: "shrinkage estimation"
            file: exercises/machine_learning.qmd
          - text: "empirical asset pricing via machine learning"
            file: exercises/gu_kelly_xiu.qmd
          - text: "neural networks"
            file: exercises/machine_learning_nonlinear.qmd
          - text: "implementable portfolios"
            file: exercises/implementable_portfolios.qmd
          - text: "---"
          - text: "volatility, risk, and uncertainty"
          - text: "(co)variance estimation"
            file: exercises/covariance_estimation.qmd
          - text: "realized covariances"
            file: exercises/realized_covariances.qmd
      - text: trading game
        menu:
          - text: the game
            file: trading-game/index.qmd
          - text: getting started
            file: trading-game/getting-started.qmd
          - text: team dashboard
            file: trading-game/dashboard.qmd
      - text: more resources
        menu:
          - text: "overview"
            file: additional-material/index.qmd
          - text: "---"
          - text: "assignments"
          - text: "assignment quality criteria"
            file: additional-material/assignment-quality-criteria.qmd
          - text: "---"
          - text: "tools"
          - text: "AI assistants"
            file: additional-material/positron-ai-assistant.qmd
          - text: "reproducible research with quarto"
            file: additional-material/quarto-documentation.qmd
          - text: "collaboration with git and github"
            file: additional-material/github-collaboration.qmd
      - icon: github
        url:  https://github.com/advanced-empirical-finance/course-homepage
  sidebar:
     - title: exercises
       style: docked
       contents:
         - exercises/index.qmd
         - section: Start
           contents:
             - exercises/technical-prerequisites.qmd
             - exercises/introduction.qmd
         - section: From Portfolio Choice to Pricing
           contents:
             - exercises/mean_variance.qmd
             - exercises/portfolio_choice.qmd
             - exercises/beta_estimation.qmd
             - exercises/portfolio_sorts.qmd
         - section: Machine Learning and the SDF
           contents:
             - exercises/machine_learning.qmd
             - exercises/gu_kelly_xiu.qmd
             - exercises/machine_learning_nonlinear.qmd
             - exercises/implementable_portfolios.qmd
         - section: Volatility, Risk, and Uncertainty
           contents:
             - exercises/covariance_estimation.qmd
             - exercises/realized_covariances.qmd
     - title: trading game
       style: docked
       contents:
         - trading-game/index.qmd
         - trading-game/getting-started.qmd
         - trading-game/dashboard.qmd
     - title: more resources
       style: docked
       contents:
         - additional-material/index.qmd
         - section: Assignments
           contents:
             - additional-material/assignment-quality-criteria.qmd
         - section: Tools
           contents:
             - additional-material/positron-ai-assistant.qmd
             - additional-material/quarto-documentation.qmd
             - additional-material/github-collaboration.qmd

format:
  html:
    # Light and dark version; the toggle sits in the navbar, and the
    # first visit follows the reader's system setting
    theme:
      light: [cosmo, theme-light.scss, course.scss]
      dark: [darkly, theme-dark.scss, course.scss]
    respect-user-color-scheme: true
    toc: true
    code-block-border-left: true
    grid:
      sidebar-width: 250px
      body-width: 1100px      # wider content (Quarto default is 900px)
      margin-width: 200px
      gutter-width: 1.5rem


eval:
  false