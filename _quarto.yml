project:
  type: website
  output-dir: docs
  # Pulls the latest lecture decks from ../course-repository and regenerates
  # slides.qmd before every render. Requires course-repository checked out
  # alongside this repo.
  pre-render:
    - tools/build-slides-page.R
  resources:
    - slides/
    - CNAME      # keep the custom domain on every render of docs/


website:
  navbar:
    collapse: true
    search: true
    right:
      - text: home
        file: index.qmd
      - text: lecture plan
        file: slides-index.qmd
      - text: exercises
        menu:
          - text: "overview"
            file: exercises/index.qmd
          - text: "---"
          - text: "introduction"
          - text: "technical prerequisites"
            file: exercises/technical-prerequisites.qmd
