            file: exercises/financial_data.qmd
          - text: "beta estimation"
            file: exercises/beta_estimation.qmd
          - text: "portfolio sorts"
            file: exercises/portfolio_sorts.qmd
          - text: "---"
          - text: "machine learning"
          - text: "empirical asset pricing via machine learning"
            file: exercises/gu_kelly_xiu.qmd
          - text: "shrinkage estimation"
            file: exercises/machine_learning.qmd
          - text: "neural networks"
